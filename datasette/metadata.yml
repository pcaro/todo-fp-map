title: Centros de FP en España
description: >-
  Centros docentes que imparten Formación Profesional (grado básico, medio y
  superior, LOE/LOGSE/LFP, y cursos de especialización), con las enseñanzas de
  cada uno y coordenadas. Datos del buscador de centros del Ministerio de
  Educación y Formación Profesional, curso 2024/2025.
databases:
  centros:
    description: >-
      Empieza por <a href="oferta_mapa">oferta_mapa</a>: una fila por centro y
      titulación, con el mapa arriba. Para ver un punto por centro, usa
      <a href="mapa">mapa</a>.
    tables:
      oferta_mapa:
        description: >-
          Una fila por centro y enseñanza de FP, con coordenadas. Filtra por
          titulación, provincia o tipo de centro en las facetas.
      mapa:
        description: >-
          Un centro que imparte FP por fila. Filtra por provincia o
          naturaleza. La columna n_ensenanzas cuenta sus titulaciones de FP.
      centros:
        description: >-
          Datos de contacto de los centros que imparten FP y tienen coordenadas
          (en la base completa hay 35.310, aquí solo los del mapa).
      oferta:
        description: >-
          Una fila por centro y enseñanza de FP (es_fp = 1). La vista
          oferta_mapa es este join con centros.
