title: Centros de Formación Profesional
description: >-
  Centros docentes no universitarios con las enseñanzas que imparten, extraídos
  del buscador del Ministerio de Educación y geocodificados con el directorio de
  la Junta de Andalucía y CartoCiudad. Fuente oficial, curso 2024/2025.
databases:
  centros:
    description: >-
      Solo Formación Profesional: ciclos de grado básico, medio y superior
      (LOE, LOGSE y LFP) y cursos de especialización. Fuera quedan ESO,
      Bachillerato, idiomas, música, danza y artes. Empieza por la tabla
      <a href="mapa">mapa</a>: el mapa aparece justo debajo de las facetas.
      Para buscar por titulación, usa
      <a href="oferta_mapa?_facet=ensenanza&_facet_size=8">oferta_mapa</a>.
    tables:
      mapa:
        description: >-
          Un centro que imparte FP por fila, con coordenadas. Filtra por
          provincia o naturaleza y el mapa se actualiza. Las coordenadas vienen del
          directorio de la Junta de Andalucía (precisión oficial) o de
          CartoCiudad (portal, callejero o centro del municipio).
      oferta_mapa:
        description: >-
          Una fila por centro y enseñanza de FP impartida, con coordenadas.
          Filtra por enseñanza o grado para ver qué centros la imparten.
